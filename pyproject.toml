[build-system]
requires = ["hatchling >= 1.31.0"]
build-backend = "hatchling.build"

[project]
name = "python_pqc_lib"
version = "0.0.3"
authors = [{name="Xantus10", email="115876592+Xantus10@users.noreply.github.com"}]
description = "A python implementation of various PQC algorithms"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography"
]
keywords = ["pqc", "post quantum", "crypto", "cryptography", "mlkem", "ml kem", "mldsa", "ml dsa"]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy >= 2.4.6"
]

[project.urls]
Homepage = "https://github.com/Xantus10/python-pqc-lib"
Documentation = "https://xantus10.github.io/python-pqc-lib/index.html"

[tool.hatch.build.targets.wheel]
packages = ["src/python_pqc_lib"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
  "tests"
]
pythonpath = [
  "src"
]
